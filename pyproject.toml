[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-risk-monitor"
version = "0.1.0"
description = "Per-incident LangGraph research, reminders and notification workflow"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "pydantic>=2.7,<3", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "apprise>=1.9,<2", "yt-dlp", "youtube-transcript-api",
  "google-auth[requests]>=2.40,<3", "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
risk-monitor = "risk_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["risk_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
